<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <radialGradient id="paper" cx="42%" cy="30%" r="92%">
      <stop offset="0%" stop-color="#f8f3e4"/>
      <stop offset="58%" stop-color="#f0e8d1"/>
      <stop offset="100%" stop-color="#ddd0b0"/>
    </radialGradient>
    <linearGradient id="inkFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7d7663" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#7d7663" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="inkNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33302a" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#33302a" stop-opacity=".32"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <filter id="softer" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <clipPath id="rim">
      <circle cx="48" cy="48" r="45"/>
    </clipPath>
  </defs>
  <circle cx="48" cy="48" r="46" fill="url(#paper)"/>
  <g clip-path="url(#rim)">
    <!-- 远山（淡墨晕染） -->
    <path filter="url(#softer)" fill="url(#inkFar)"
      d="M-4 62 C 10 44 22 40 34 52 C 44 62 52 58 62 48 C 74 36 88 46 100 58 L 100 100 L -4 100 Z"/>
    <!-- 近山（浓墨） -->
    <path filter="url(#soft)" fill="url(#inkNear)"
      d="M-6 78 C 8 62 20 60 32 69 C 46 79 58 75 70 64 C 82 54 94 62 102 71 L 102 102 L -6 102 Z"/>
    <!-- 水面波光 -->
    <path d="M14 85 C 30 83 44 87 60 85 C 72 83 84 85 92 84"
      stroke="#6f685a" stroke-opacity=".35" stroke-width="1.4" fill="none" filter="url(#soft)"/>
    <!-- 飞鸟 -->
    <path d="M54 27 q 4 -4.5 8.5 0 M 65 22.5 q 3.4 -3.8 7.4 0"
      stroke="#4a463c" stroke-opacity=".6" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- 角落印章 -->
    <g transform="rotate(-5 76 31)">
      <rect x="70.5" y="25.5" width="11" height="11" rx="1.5" fill="#b23a2b"/>
      <rect x="72.2" y="27.2" width="7.6" height="7.6" fill="none"
        stroke="#f2edde" stroke-opacity=".65" stroke-width=".8"/>
    </g>
    <!-- 内圈晕影 -->
    <circle cx="48" cy="48" r="44" fill="none" stroke="#8a7c58" stroke-opacity=".28" stroke-width="2.5"/>
  </g>
  <circle cx="48" cy="48" r="45.6" fill="none" stroke="#b9a978" stroke-opacity=".85" stroke-width="1.4"/>
</svg>
