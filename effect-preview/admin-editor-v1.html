<!doctype html>
<html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文章编辑 · 山窗案头设计图</title><link rel="stylesheet" href="../public/fonts/hongleixingshu/font.css"><link rel="stylesheet" href="admin-desk-overview-v1.css"><link rel="stylesheet" href="admin-subpages-v1.css"><link rel="stylesheet" href="admin-editor-v1.css"><script src="admin-subpages-v1.js" defer></script><script src="admin-editor-v1.js" defer></script></head>
<body data-page="posts" data-title="文章编辑"><div id="admin-preview-bar"></div><div class="studio"><aside class="sidebar" id="admin-sidebar" aria-label="后台导航"></aside><main class="sub-main"><header class="page-head editor-page-head"><div><p class="eyebrow">01 / WRITING ROOM</p><h1>接着写，慢慢成篇。</h1><p class="description">把心里的句子，落在这一页纸上。</p></div><a href="admin-posts-v1.html" class="quiet-button">← 文章列表</a></header>
<form id="editor-form"><div class="editor-actionbar"><div class="editor-save-identity"><span class="small-seal" aria-hidden="true">稿</span><span id="editor-save-state" role="status" aria-live="polite">手稿尚未改动</span></div><div class="editor-actions"><button type="button" class="quiet-button" id="editor-immersive">专心写作</button><button type="button" class="sub-button" id="editor-draft-preview">预览草稿</button><button type="button" class="sub-button" id="editor-save">保存草稿</button><button type="submit" class="sub-button primary" id="editor-publish">发布文章 ↗</button></div></div>
<div class="editor-workspace"><section class="sheet editor-manuscript" aria-label="手稿正文"><header class="editor-paper-head"><span>MANUSCRIPT / 手稿</span><span id="editor-paper-status">未刊 · 待续</span></header><label class="editor-title-label" for="editor-title">篇名</label><input id="editor-title" class="editor-title-input" required maxlength="180" placeholder="这篇文章叫什么？" autocomplete="off"><div class="editor-tool-row"><div class="editor-markdown-tools" role="toolbar" aria-label="Markdown 快捷插入"><button type="button" data-md="heading" aria-label="插入二级标题" title="插入二级标题">H₂</button><button type="button" data-md="bold" aria-label="插入粗体" title="插入粗体"><b>粗</b></button><button type="button" data-md="italic" aria-label="插入斜体" title="插入斜体"><i>斜</i></button><button type="button" data-md="quote" aria-label="插入引用" title="插入引用">引</button><button type="button" data-md="link" aria-label="插入链接" title="插入链接">链</button><button type="button" data-md="code" aria-label="插入行内代码" title="插入行内代码">码</button><button type="button" data-md="block" aria-label="插入代码块" title="插入代码块">块</button><button type="button" data-md="image" aria-label="插入图片语法" title="插入图片语法">图</button><button type="button" data-md="list" aria-label="插入列表" title="插入列表">列</button></div><div class="editor-modes" role="group" aria-label="正文模式"><button type="button" id="editor-edit-mode" aria-pressed="true">编辑</button><button type="button" id="editor-preview-mode" aria-pressed="false">预览</button></div></div><div class="editor-writing-stage" id="editor-writing-stage" data-tone="paper"><label class="editor-body-label" for="editor-content">Markdown 正文</label><textarea id="editor-content" spellcheck="false" placeholder="从一句话开始……"></textarea><div id="editor-inline-preview" class="editor-inline-preview" hidden aria-label="Markdown 正文预览"></div></div><footer class="editor-paper-foot"><span id="editor-count">0 字 · 0 段</span><span>Markdown <i>·</i> Ctrl / ⌘ S 保存</span></footer></section>
<aside class="editor-margin" aria-label="文章设置"><section class="sheet editor-settings"><header class="sheet-head"><div><p class="eyebrow">THE MARGIN / 页边小记</p><h2>文章设置</h2></div><span class="small-seal" aria-hidden="true">录</span></header><label class="control"><span>文章链接 · SLUG</span><input id="editor-slug" type="text" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" placeholder="autumn-window" autocomplete="off"><small id="editor-link-hint">/posts/autumn-window</small></label><label class="control"><span>一行小序 · 摘要</span><textarea id="editor-excerpt" rows="4" maxlength="300" placeholder="首页列表里显示的一句话简介"></textarea></label><div class="editor-publish-state"><span class="chip" id="editor-status">草稿</span><p id="editor-publish-note">收为草稿，暂不出现在前台。</p></div></section>
<section class="sheet editor-tone-sheet" aria-labelledby="editor-tone-title"><p class="eyebrow">WRITING SURFACE</p><h2 id="editor-tone-title">挑一张合意的纸。</h2><div class="editor-tones" role="group" aria-label="写作背景"><button type="button" data-tone="paper" aria-pressed="true"><i></i><span>宣纸</span></button><button type="button" data-tone="plain" aria-pressed="false"><i></i><span>素白</span></button><button type="button" data-tone="warm" aria-pressed="false"><i></i><span>暖杏</span></button><button type="button" data-tone="night" aria-pressed="false"><i></i><span>夜墨</span></button></div></section><div class="editor-quiet-note"><span></span><p>文字有自己的步调。<br>慢慢写，也很好。</p></div></aside></div><p id="editor-error" class="editor-error" role="alert" hidden></p></form>
<footer class="sub-footer">山窗常开，文字常新。<span>示例手稿 · 仅本页内存</span></footer></main></div>
<dialog id="editor-publish-dialog" aria-labelledby="editor-dialog-title"><header class="dialog-head"><div><p class="eyebrow">READY TO PUBLISH / 成篇</p><h2 id="editor-dialog-title">让这一页，遇见读者。</h2></div><button type="button" class="dialog-close" id="editor-dialog-close" aria-label="关闭发布确认">×</button></header><p id="editor-confirm-copy"></p><dl class="editor-confirm-summary"><div><dt>文章链接</dt><dd id="editor-confirm-slug"></dd></div><div><dt>正文</dt><dd id="editor-confirm-count"></dd></div></dl><p class="editor-dialog-note">此处只演示发布状态，不会写入后台。</p><footer class="dialog-foot"><button type="button" class="sub-button" id="editor-publish-cancel">再读一遍</button><button type="button" class="sub-button primary" id="editor-publish-accept">确认发布 ↗</button></footer></dialog><noscript><p class="noscript">编辑、Markdown 预览与保存演示需要启用 JavaScript。</p></noscript></body></html>
